<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Martín López Fotografía</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="encabezado">
        <h1>Contacto</h1>

        <nav class="navegacion">
            <a href="index.html">Inicio</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenido-principal">

        <p>
            Si querés consultar disponibilidad, solicitar un presupuesto o conocer más
            detalles sobre alguno de los servicios, podés completar el siguiente formulario.
        </p>

        <form class="formulario">

            <label for="nombre">Nombre y apellido:</label>
            <input type="text" id="nombre" name="nombre">

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email">

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">

            <label for="servicio">Servicio de interés:</label>

            <select id="servicio" name="servicio">
                <option>Fotografía de eventos</option>
                <option>Retratos</option>
                <option>Fotografía de productos</option>
                <option>Contenido para emprendimientos</option>
                <option>Otro</option>
            </select>

            <label for="fecha">Fecha aproximada:</label>
            <input type="date" id="fecha" name="fecha">

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="6"></textarea>

            <input type="submit" value="Enviar consulta">

        </form>

    </main>

    <footer class="pie">
        <p>Martín López Fotografía</p>
    </footer>

</body>

</html>
